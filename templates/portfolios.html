<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏦 投资组合概览 - 动态基金再平衡系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fas fa-chart-line me-2"></i>
                动态基金再平衡系统
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="/">
                    <i class="fas fa-briefcase me-1"></i>
                    投资组合概览
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- 页面标题和操作按钮 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h2 class="mb-1">
                            <i class="fas fa-briefcase me-2 text-primary"></i>
                            投资组合概览
                        </h2>
                        <p class="text-muted mb-0">管理您的所有投资组合</p>
                    </div>
                    <div>
                        <button class="btn btn-success" onclick="showCreatePortfolioModal()">
                            <i class="fas fa-plus me-2"></i>
                            创建新组合
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 投资组合列表 -->
        <div class="row" id="portfoliosContainer">
            <!-- 投资组合卡片将在这里动态加载 -->
        </div>

        <!-- 空状态提示 -->
        <div class="row" id="emptyState" style="display: none;">
            <div class="col-12">
                <div class="text-center py-5">
                    <i class="fas fa-folder-open fa-4x text-muted mb-3"></i>
                    <h4 class="text-muted">还没有投资组合</h4>
                    <p class="text-muted mb-4">创建您的第一个投资组合开始管理资产配置</p>
                    <button class="btn btn-primary" onclick="showCreatePortfolioModal()">
                        <i class="fas fa-plus me-2"></i>
                        创建投资组合
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 创建投资组合模态框 -->
    <div class="modal fade" id="createPortfolioModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-plus-circle me-2"></i>
                        创建新投资组合
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createPortfolioForm">
                        <div class="mb-3">
                            <label class="form-label">组合名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="portfolioName" required 
                                   placeholder="例如：稳健增长组合">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">组合描述</label>
                            <textarea class="form-control" id="portfolioDescription" rows="3" 
                                      placeholder="描述该投资组合的投资策略和目标..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">初始投资金额（元） <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="portfolioTotalAmount" required 
                                   step="0.01" min="0.01" placeholder="例如：100">
                            <div class="form-text">请输入您的初始投资总金额</div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">三桶投资占比分配 <span class="text-danger">*</span></label>
                            <div class="alert alert-info">
                                <i class="fas fa-info-circle me-2"></i>
                                请设置三个桶的投资占比，总和必须等于100%
                            </div>
                            
                            <div class="row">
                                <div class="col-md-4">
                                    <label class="form-label text-primary">
                                        <i class="fas fa-coins me-1"></i>
                                        短期桶（货币基金）
                                    </label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="shortTermRatio" 
                                               step="0.01" min="0" max="100" value="10" required>
                                        <span class="input-group-text">%</span>
                                    </div>
                                    <div class="form-text">提供流动性</div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label text-success">
                                        <i class="fas fa-chart-line me-1"></i>
                                        中期桶（债券基金）
                                    </label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="mediumTermRatio" 
                                               step="0.01" min="0" max="100" value="30" required>
                                        <span class="input-group-text">%</span>
                                    </div>
                                    <div class="form-text">稳定收益</div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label text-warning">
                                        <i class="fas fa-rocket me-1"></i>
                                        长期桶（股票基金）
                                    </label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="longTermRatio" 
                                               step="0.01" min="0" max="100" value="60" required>
                                        <span class="input-group-text">%</span>
                                    </div>
                                    <div class="form-text">长期增长</div>
                                </div>
                            </div>
                            
                            <div class="mt-2">
                                <small class="text-muted">
                                    当前总占比：<span id="totalRatioDisplay" class="fw-bold">100%</span>
                                </small>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="createPortfolio()">
                        <i class="fas fa-plus me-1"></i>
                        创建组合
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑投资组合模态框 -->
    <div class="modal fade" id="editPortfolioModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-edit me-2"></i>
                        编辑投资组合
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editPortfolioForm">
                        <input type="hidden" id="editPortfolioId">
                        <div class="mb-3">
                            <label class="form-label">组合名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="editPortfolioName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">组合描述</label>
                            <textarea class="form-control" id="editPortfolioDescription" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">投资金额（元）</label>
                            <input type="number" class="form-control" id="editPortfolioTotalAmount" 
                                   step="0.01" min="0" placeholder="例如：100">
                            <div class="form-text">更新投资组合的总金额</div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="updatePortfolio()">
                        <i class="fas fa-save me-1"></i>
                        保存更改
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 删除确认模态框 -->
    <div class="modal fade" id="deletePortfolioModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-danger">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        确认删除
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>您确定要删除投资组合 "<span id="deletePortfolioName" class="fw-bold"></span>" 吗？</p>
                    <div class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <strong>警告：</strong>此操作将永久删除该投资组合及其所有基金配置和历史记录，且无法恢复。
                    </div>
                    <input type="hidden" id="deletePortfolioId">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" onclick="confirmDeletePortfolio()">
                        <i class="fas fa-trash me-1"></i>
                        确认删除
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载提示 -->
    <div class="position-fixed top-50 start-50 translate-middle" id="loadingIndicator" style="display: none; z-index: 9999;">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">加载中...</span>
        </div>
    </div>

    <!-- Toast 消息 -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="messageToast" class="toast" role="alert">
            <div class="toast-header">
                <i class="fas fa-info-circle me-2 text-primary"></i>
                <strong class="me-auto">系统消息</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage">
                <!-- 消息内容 -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/portfolios.js"></script>
</body>
</html>
